<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
</head>
<body>

    <h2>Simple Calculator</h2>

    <script>

        function calculator(num1, num2, operator) {

            let result;

            switch(operator) {

                case '+':
                    result = num1 + num2;
                    break;

                case '-':
                    result = num1 - num2;
                    break;

                case '*':
                    result = num1 * num2;
                    break;

                case '/':
                    result = num1 / num2;
                    break;

                default:
                    result = "Invalid Operator";
            }

            return result;
        }

        // User Input
        let number1 = parseFloat(prompt("Enter first number:"));
        let number2 = parseFloat(prompt("Enter second number:"));
        let op = prompt("Enter operator (+, -, *, /):");

        // Function Call
        let answer = calculator(number1, number2, op);

        // Display Result
        document.write("<h3>Result = " + answer + "</h3>");

    </script>

</body>
</html>
