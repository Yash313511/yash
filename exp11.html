<!DOCTYPE html>
<html>
<head>
    <title>String Manipulation in PHP</title>
</head>
<body>

    <h2>PHP String Functions</h2>

    <?php

        $str = "Hello World";

        // String Length
        echo "<b>Original String:</b> " . $str . "<br><br>";

        echo "<b>String Length:</b> " . strlen($str) . "<br><br>";

        // Reverse String
        echo "<b>Reverse String:</b> " . strrev($str) . "<br><br>";

        // Substring
        echo "<b>Substring:</b> " . substr($str, 0, 5) . "<br><br>";

    ?>

</body>
</html>
