<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Types Example</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkblue;
            text-align: center;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            margin: auto;
        }

        th {
            background-color: lightgray;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="background-color: lightyellow;">
        Student Information
    </h1>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Amit</td>
            <td>85</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Rahul</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
