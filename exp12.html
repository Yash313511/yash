<!DOCTYPE html>
<html>
<head>
    <title>PHP Array Example</title>
</head>
<body>

    <h2>Store and Display Array Values</h2>

    <?php

        // Creating an array
        $students = array("Amit", "Rahul", "Sneha", "Priya");

        // Displaying array values
        echo "<b>Student Names:</b><br><br>";

        foreach($students as $name)
        {
            echo $name . "<br>";
        }

    ?>

</body>
</html>
