<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image, Hyperlink and Nested Table</title>
</head>
<body>

    <h1>My Web Page</h1>

    <h2>Image</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSH0fns_o6hQosDjg0jNSNDQxpMQtC2w-X68w&s" alt="Sample Image" width="200">

    <h2>Hyperlink</h2>
    <a href="https://www.google.com">Click here to visit Google</a>

    <h2>Table with Nested Table</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Amit</td>

            <td>
                <table border="1" cellpadding="10">
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>

                    <tr>
                        <td>Maths</td>
                        <td>80</td>
                    </tr>

                    <tr>
                        <td>Science</td>
                        <td>85</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
